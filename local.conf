#
# Our HestiaCP-Pluginable feature to intercept calls to Hestia's bin/
# commands and invoke plugin actions/filters.
#

# Check if bin_actions is set and if it is, then return
if [ -n "$bin_actions" ]; then
    return
fi

# Set bin_actions to prevent re-entry
export bin_actions=1

# Get the script name
script_name=$(basename "$0")

# Do not intercept the backup/dns queues: the double-run guard in v-update-sys-queue
# counts processes via "ps auxf | grep ... v-update-sys-queue dns" (a substring match,
# so it also matches the real queue name "dns-cluster"), and the pluginable wrapper adds
# extra processes, so the queue silently exits and never runs. Match any "dns*" queue name
# (not just the literal "dns", which v-update-sys-queue doesn't even accept) so this keeps
# working if Hestia adds another dns-prefixed queue later.
if [ "$script_name" = "v-update-sys-queue" ] && { [ "$1" = "backup" ] || [ "${1#dns}" != "$1" ]; }; then
    return
fi

# PERFORMANCE fast path: pluginable.php writes the list of commands that have plugin hooks to
# data/hcpp/hooked-cmds. For any other command run the original script right away (no php start,
# no plugin loading). The list is ignored (full path) when logging is on, when it is missing, or when
# any php file of the plugins / hooks folders is newer than the list (plugin added, updated, disabled).
_hcpp_m=/usr/local/hestia/data/hcpp/hooked-cmds
if [ -f "$_hcpp_m" ] && [ ! -e /etc/hestiacp/hooks/logging ] \
   && [ ! /usr/local/hestia/plugins -nt "$_hcpp_m" ] \
   && [ -z "$(find /usr/local/hestia/plugins /etc/hestiacp/hooks -maxdepth 3 -name '*.php' -newer "$_hcpp_m" -print -quit 2>/dev/null)" ]; then
    _hcpp_l=$'\n'"$(<"$_hcpp_m")"$'\n'
    _hcpp_c="${script_name//-/_}"
    case "$_hcpp_l" in
        *$'\n'"$_hcpp_c"$'\n'*) ;;
        *) unset _hcpp_m _hcpp_l _hcpp_c; return ;;
    esac
fi
unset _hcpp_m _hcpp_l _hcpp_c

# Invoke php script to run the original v-* command, allowing for plugin hooks
# to modify arguments and output.
# Arguments are passed through as-is (no printf %q re-encoding), so values that
# contain backslashes (passwords, cron commands like "find ... -exec ... \;") stay intact.
php -f /etc/hestiacp/hooks/pluginable.php -- "$script_name" "$@"
exit
